# Configs for ahrvoje.github.io

title: "Enjoying the details"
name: "Hrvoje Abraham"
email: ahrvoje@gmail.com
url: "http://ahrvoje.github.io"
repository: "ahrvoje/ahrvoje.github.io"

include:
  - _pages
  - assets
  - index.html
exclude:
  - TODO.md
  - README.md
  - "*.org"
  - "*ltximg*"

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache

# Build settings
markdown: kramdown
theme: "minimal-mistakes-jekyll"
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dirt"
search: true

# settings for author profile
author:
  name   : "Hrvoje Abraham"
  avatar : "assets/images/ahrvoje_avatar_2020-05-31.png"
  bio    : "Bio info"
  location: "Zagreb, Croatia"
  github : ahrvoje
  linkedin: hrvojeabraham
  email  : ahrvoje@gmail.com

# comments by disqus
comments:
  provider: "disqus"
  disqus:
    shortname: "ahrvoje-github-io"

# pagination for blog page
paginate: 10 # number of posts to show
paginate_path: /page:num/

# default YAML front matter
defaults:
  # all
  - scope:
      path: ""
    values:
      layout: single, search
      mathjax: true
      author_profile: true
      class: wide
      title: " "
      title_separator: "|"
  # posts
  - scope:
      type: posts
    values:
      layout: search
      toc: true
      toc_label: "Contents"
      read_time: false
      comments: true

# collections
collections:
